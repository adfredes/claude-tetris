name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            Tareas:
            1. Lee el issue con `gh issue view ${{ github.event.issue.number }}`.
            2. Lista los labels disponibles con `gh label list` y asigna los apropiados
               con `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`.
               Solo usa labels existentes, NO crees labels nuevos.
            3. Explora el código fuente relevante (game.js, index.html, style.css)
               para entender el contexto del problema reportado.
            4. Publica UN comentario en ESPAÑOL con `gh issue comment ${{ github.event.issue.number }} --body "..."`.
               El comentario debe incluir:
               - **Tipo**: bug / mejora / pregunta / etc.
               - **Diagnóstico**: análisis del problema y causa raíz probable.
               - **Archivos/funciones afectados**: referencias concretas (ej. `game.js` → función `clearLines()`).
               - **Enfoque sugerido**: pasos de alto nivel para implementar la solución.

            No modifiques código. No hagas commits. No crees ni borres labels.
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
